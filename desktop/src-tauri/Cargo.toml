[package]
name = "desktop"
version = "1.0.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# `build.rs` computes the backend runtime id with the same code the crate uses.
sha2 = "=0.10.9"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-mcp-bridge = "0.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tls`: the Keygate server and the runtime CDN are https.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
dirs = "6.0"
sha2 = "=0.10.9"
flate2 = "=1.1.10"
tar = "=0.4.46"
# Licensing: decoding Keygate's base64url tokens.
base64 = "=0.22.1"
# Free-space check before the first-run model download.
fs4 = "=1.1.0"
# "FileSeek is ready" once a background first-run download finishes.
tauri-plugin-notification = "=2.5.1"
# Licensing: verifying Keygate's Ed25519-signed tokens, and a random Idempotency-Key per
# activation (getrandom is already in the tree).
ed25519-dalek = "=3.0.0"
getrandom = "=0.2.17"
# App updates: Keygate's feed, artifacts signed by Keygate; semver (already in the tree)
# compares against its minimum supported version.
tauri-plugin-updater = "=2.13.1"
semver = "=1.0.28"
# Racing an update download against its cancel flag; already in the tree via tauri.
tokio = { version = "=1.53.1", features = ["time", "macros"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The start-at-login switch registers under HKCU\...\Run on Windows; the other two
# platforms write a file and need no extra dependency (see `src/autostart.rs`).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
