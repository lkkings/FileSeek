[project]
name = "fileseek"
version = "0.1.0"
description = "Local-first semantic file search backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    # Drives the `python -m fileseek` command line.
    "click==8.5.0",
    "faiss-cpu==1.15.1",
    "torch==2.14.0",
    # 图片检索必须有它，两道坎叠在一起：
    #   1. transformers 5.x 的 `AutoImageProcessor` 是个 requires_backends("torchvision")
    #      存根，取属性就抛 ImportError——连 `use_fast=False` 都来不及传。
    #   2. jina-clip-v2 的 preprocessor_config.json 用 auto_map 指向
    #      `jinaai/jina-clip-implementation`，那边的 transform.py 顶层
    #      `import torchvision.transforms`。
    # 所以换个非门禁的 PIL 处理器类也绕不开。版本跟 torch 2.14.0 配对。
    "torchvision==0.29.0",
    # 同上那份 transform.py 的连带要求。它里面 timm 其实是懒加载（只在
    # `if use_timm:` 分支里 import，我们没走那条路），但 transformers 载入远程代码前会用
    # `check_imports()` 静态扫描 import 行，扫到就要求装上，装不上直接 ImportError。
    "timm==1.0.30",
    "transformers==5.17.0",
    "sentence-transformers==6.0.1",
    "rapidocr-onnxruntime==1.4.4",
    "av==18.1.0",
    "zeroconf==0.151.3",
    "keyring==25.7.0",
    "pyyaml==6.0.3",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "python-docx==1.2.0",
    "pillow==12.3.0",
    "chromadb>=1.5.9",
    "imagehash>=4.3.2",
    "huggingface-hub==1.31.0",
    "onnxruntime==1.30.0",
    "smbprotocol==1.17.0",
    "webdavclient3==3.14.7",
    "tortoise-orm==0.25.1",
    # Tortoise 0.25.1 calls aiosqlite.Connection.start(), removed in 0.22.
    "aiosqlite==0.21.0",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.2",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    # Drives the async TaskScheduler tests.
    "pytest-asyncio==1.3.0",
    # Drives the FastAPI TestClient.
    "httpx==0.28.1",
    "types-pyyaml==6.0.12.20250915",
]

[project.scripts]
fileseek = "fileseek.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fileseek"]

[tool.uv]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "RET",
    "ARG",
    "TRY",
    "S",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, take unused fixtures, and hardcode stand-in tokens.
"tests/**" = ["S101", "S105", "S106", "ARG"]
"../compatibility-tests/file-types/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["fileseek"]
# Test helper modules imported by name from the compatibility test directory.
known-local-folder = ["doc_fixtures", "fake_encoders", "video_fixtures", "file_type_contract"]

[[tool.mypy.overrides]]
# Ships no stubs or py.typed marker; calls into it are wrapped at one boundary.
module = ["rapidocr_onnxruntime.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["fileseek"]
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests", "../compatibility-tests/file-types"]
# "." 让 tests 包可被 import：API 测试共享 tests/api/conftest.py 里的常量与假实现。
pythonpath = ["src", ".", "../compatibility-tests/file-types"]
addopts = "-q --strict-markers --strict-config -W ignore::Warning"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: loads real model weights; skipped when they are not on disk",
]
# strict 模式：async 测试必须显式标 @pytest.mark.asyncio。不标的会被明确报错，
# 而不是静默跳过——一个从没运行过的测试比没有测试更糟。
asyncio_mode = "strict"

[tool.coverage.run]
source = ["fileseek"]
branch = true
# concurrency/parallel/sigterm 曾经是为一个 spawn 出来的模型 worker 子进程设的。
# 那个 worker 在重构中已经没了（src/ 下不再有 multiprocessing），而留着这几项会让
# 主进程的测量数据落到分片文件里不合并——结果是覆盖率被显著低报（auth.py 明明被
# 10 个用例覆盖却报 34%）。恢复前请确认真的又有子进程要测。

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[dependency-groups]
dev = [
    "types-defusedxml==0.7.0.20260504",
]
