[project]
name = "fileseek"
version = "0.1.0"
description = "Local-first semantic file search backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    # Drives the `python -m fileseek` command line.
    "click==8.5.0",
    # jina-clip-v2 的分词直接读 tokenizer.json，不经过 transformers。
    "tokenizers==0.23.2",
    "rapidocr-onnxruntime==1.4.4",
    "av==18.1.0",
    "pyyaml==6.0.3",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "python-docx==1.2.0",
    "pillow==12.3.0",
    "chromadb>=1.5.9",
    "huggingface-hub==1.31.0",
    "onnxruntime==1.30.0",
    "tortoise-orm==0.25.1",
    "watchfiles==1.2.0",
    # Tortoise 0.25.1 calls aiosqlite.Connection.start(), removed in 0.22.
    "aiosqlite==0.21.0",
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "onnx==1.23.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.2",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    # Drives the async TaskScheduler tests.
    "pytest-asyncio==1.3.0",
    "types-pyyaml==6.0.12.20250915",
    # Obfuscates the backend package the desktop app ships (build_protected.py).
    "pyarmor==9.2.6",
]

[project.scripts]
fileseek = "fileseek.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fileseek"]

[tool.uv]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "RET",
    "ARG",
    "TRY",
    "S",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, take unused fixtures, and hardcode stand-in tokens.
"tests/**" = ["S101", "S105", "S106", "ARG"]
"../compatibility-tests/file-types/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["fileseek"]
# Test helper modules imported by name from the compatibility test directory.
known-local-folder = ["doc_fixtures", "fake_encoders", "video_fixtures", "file_type_contract"]

[[tool.mypy.overrides]]
# Ships no stubs or py.typed marker; calls into it are wrapped at one boundary.
module = ["rapidocr_onnxruntime.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["fileseek"]
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests", "../compatibility-tests/file-types"]
# "." 让 tests 包可被 import：API 测试共享 tests/api/conftest.py 里的常量与假实现。
pythonpath = ["src", ".", "../compatibility-tests/file-types"]
addopts = "-q --strict-markers --strict-config -W ignore::Warning"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: loads real model weights; skipped when they are not on disk",
]
# strict 模式：async 测试必须显式标 @pytest.mark.asyncio。不标的会被明确报错，
# 而不是静默跳过——一个从没运行过的测试比没有测试更糟。
asyncio_mode = "strict"

[tool.coverage.run]
source = ["fileseek"]
branch = true
# 导入、查询两个模型子进程用 spawn 启动，测试里真的会起它们（tests/tasks/test_task_worker_process.py
# 等）。子进程的测量数据落到分片文件里，必须用 `coverage combine` 合并后再出报告，否则
# 主进程的数字会被显著低报（之前 auth.py 被 10 个用例覆盖却报 34% 就是这个原因）。
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[dependency-groups]
dev = [
    "types-defusedxml==0.7.0.20260504",
]
